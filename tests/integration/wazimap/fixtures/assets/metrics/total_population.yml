name: total_population
kind: SIMPLE_AGG

spec:
  dataset_name: population
  expr: count
  agg: SUM
  filters: []

additivity:
  type: ADDITIVE
  across_time: true
  across_geo: true
  rollup_policy: ALLOW

valid_geo_levels:
  - country
  - province
  - district
  - municipality
  - ward

valid_time_grains:
  - YEAR

unit:
  name: people
  scale: 1

comparability:
  methodology_id: census_2022
  methodology_version: "1.0"
  population_definition: total_population
