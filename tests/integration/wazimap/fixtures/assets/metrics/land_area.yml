name: land_area
kind: SIMPLE_AGG

spec:
  dataset_name: geography
  expr: area_km2
  agg: SUM
  filters: []

additivity:
  type: ADDITIVE
  across_time: true
  across_geo: true
  rollup_policy: ALLOW

valid_geo_levels:
  - country
  - province
  - district
  - municipality
  - ward

valid_time_grains: []

unit:
  name: km2
  scale: 1
