name: has_birth_certificate
physical_ref:
  schema: nlss
  table: has_birth_certificate

kind: FACT

grain_keys:
  geo:
    - geo_code
  time: []
  other: []

description: "Proportion of population with birth certificates"

tags:
  - demographics
  - civil-registration

columns:
  - name: geo_code
    data_type: STRING
    description: Geographic area code (state or LGA)
    nullable: false
    stats:
      row_count: 1534
      null_count: 0
      distinct_count: 767
      sample_values: ["NGA", "NG001", "NG002", "NG003", "NG004"]

  - name: has_birth_certificate
    data_type: STRING
    nullable: false
    stats:
      row_count: 1534
      null_count: 0
      distinct_count: 2
      sample_values: ["YES", "NO"]

  - name: count
    data_type: INTEGER
    description: Population count
    nullable: false
    stats:
      row_count: 1534
      null_count: 0
      distinct_count: 344
      sample_values: ["0", "25", "14", "20", "1"]
