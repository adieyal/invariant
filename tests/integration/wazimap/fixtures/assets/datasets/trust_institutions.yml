      null_count: 0
      distinct_count: 4
      sample_values: ["YES", "NO", "DON'T KNOW ANYONE FROM THIS GROUP", "REFUSE TO ANSWER"]

  - name: count
    data_type: INTEGER
    description: Population count
    nullable: false
