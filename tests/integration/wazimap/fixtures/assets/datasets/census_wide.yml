name: census_wide
physical_ref:
  schema: census
  table: census_wide_format

kind: FACT

grain_keys:
  geo:
    - geo_level
    - geo_code
  time: []
  other: []

geography_config:
  hierarchy_name: south_africa
  level_column: geo_level
  code_column: geo_code

# Time series for wide-format data (columns for each time period)
time_series:
  - base_name: population
    columns:
      - column: population_2011
        period: "2011-01-01"
        grain: YEAR
      - column: population_2016
        period: "2016-01-01"
        grain: YEAR
      - column: population_2022
        period: "2022-01-01"
        grain: YEAR

  - base_name: households
    columns:
      - column: households_2011
        period: "2011-01-01"
        grain: YEAR
      - column: households_2016
        period: "2016-01-01"
        grain: YEAR
      - column: households_2022
        period: "2022-01-01"
        grain: YEAR

columns:
  - name: geo_level
    data_type: STRING
    description: Geographic hierarchy level
    nullable: false
    stats:
      row_count: 5000
      null_count: 0
      distinct_count: 3
      sample_values: ["province", "municipality", "ward"]

  - name: geo_code
    data_type: STRING
    description: Geographic area code
    nullable: false
    stats:
      row_count: 5000
      null_count: 0
      distinct_count: 4500
      sample_values: ["ZA", "ZA-WC", "CPT", "WC011"]

  - name: population_2011
    data_type: INTEGER
    description: Population count from 2011 census
    nullable: true
    stats:
      row_count: 5000
      null_count: 50
      distinct_count: 4200
      sample_values: ["51770560", "5822734", "3740026"]

  - name: population_2016
    data_type: INTEGER
    description: Population count from 2016 community survey
    nullable: true
    stats:
      row_count: 5000
      null_count: 75
      distinct_count: 4150
      sample_values: ["55653654", "6279730", "4055116"]

  - name: population_2022
    data_type: INTEGER
    description: Population count from 2022 census
    nullable: true
    stats:
      row_count: 5000
      null_count: 100
      distinct_count: 4100
      sample_values: ["62027503", "7113776", "4807162"]

  - name: households_2011
    data_type: INTEGER
    description: Household count from 2011 census
    nullable: true

  - name: households_2016
    data_type: INTEGER
    description: Household count from 2016 community survey
    nullable: true

  - name: households_2022
    data_type: INTEGER
    description: Household count from 2022 census
    nullable: true
