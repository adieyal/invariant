      null_count: 0
      distinct_count: 767
      sample_values: ["NGA", "NG001", "NG002", "NG003", "NG004"]

  - name: health_facility_type
    data_type: STRING
    nullable: false
    stats:
      row_count: 7670
      null_count: 0
      distinct_count: 10
      sample_values: ["HOSPITAL", "CLINIC/PRIMARY HEALTH CENTER (PHC)", "PHARMACY", "CHEMIST SHOP (DRUG SHOP)", "MATERNITY HOME/ MATERNAL AND CHILD HEALTH POST"]

  - name: count
    data_type: INTEGER
    description: Population count
    nullable: false
    stats:
      row_count: 7670
      null_count: 0
      distinct_count: 188
      sample_values: ["0", "1", "2", "3", "4"]
