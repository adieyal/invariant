  table: health_facility_type

kind: FACT

grain_keys:
  geo:
    - geo_code
  time: []
  other: []

description: "Distribution of health consultations by type of facility"

tags:
  - health
  - healthcare-facilities

columns:
  - name: geo_code
    data_type: STRING
    description: Geographic area code (state or LGA)
    nullable: false
