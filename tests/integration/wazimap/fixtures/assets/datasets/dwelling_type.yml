name: dwelling_type
physical_ref:
  schema: nlss
  table: dwelling_type

kind: FACT

grain_keys:
  geo:
    - geo_code
  time: []
  other: []

description: "Distribution of households by type of dwelling"

tags:
  - housing
  - dwelling-characteristics

columns:
  - name: geo_code
    data_type: STRING
    description: Geographic area code (state or LGA)
    nullable: false
    stats:
      row_count: 7670
      null_count: 0
      distinct_count: 767
      sample_values: ["NGA", "NG001", "NG002", "NG003", "NG004"]

  - name: dwelling_type
    data_type: STRING
    nullable: false
    stats:
      row_count: 7670
      null_count: 0
      distinct_count: 10
      sample_values: ["SEPARATE HOUSE (BUNGALOW)", "SEMI-DETACHED HOUSE", "FLAT/APARTMENT", "COMPOUND HOUSE (SEPARATE ROOMS, SHARING FACILITIES)", "HUTS/BUILDINGS [SAME/SHARED COMPOUND]"]

  - name: count
    data_type: INTEGER
    description: Population count
    nullable: false
    stats:
      row_count: 7670
      null_count: 0
      distinct_count: 161
      sample_values: ["0", "1", "2", "3", "4"]
