site_name: Invariant Analytics Kernel
site_description: Semantic validation layer for statistical data platforms
repo_url: https://github.com/adieyal/invariant
repo_name: adieyal/invariant
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.png

extra_css:
  - stylesheets/custom.css

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Quickstart: getting-started/quickstart.md
    - Mental Model: getting-started/mental-model.md
  - Examples:
    - examples/index.md
    - Indicator Aggregation: examples/indicator-aggregation.md
    - Cross-dataset Comparison: examples/cross-dataset-comparison.md
    - Reference System Changes: examples/reference-system-changes.md
    - Suppression: examples/suppression.md
    - Executable Examples: generated/examples.md
  - Concepts:
    - concepts/index.md
    - Universe: concepts/universe.md
    - Variables: concepts/variables.md
    - Reference Systems: concepts/reference-systems.md
    - Data Products: concepts/data-products.md
    - Validation Gate: concepts/validation-gate.md
  - Architecture:
    - architecture/index.md
    - Query, Rules, Gate: architecture/two-planes-and-gate.md
    - Progressive Rigor: architecture/progressive-rigor.md
    - Scope Boundaries: architecture/scope-boundaries.md
  - Integration:
    - integration/index.md
    - Minimal Integration: integration/minimal-integration.md
    - Progressive Features: integration/progressive-features.md
    - Catalog: integration/catalog.md
    - Query Lifecycle: integration/query-lifecycle.md
  - Reference:
    - reference/index.md
    - Glossary: generated/glossary.md
    - Validation Rules: generated/validation-rules.md
    - Aggregation Rules: generated/aggregation-rules.md
    - Ports: reference/ports.md
    - Use Cases: reference/use-cases.md
    - DTOs: reference/dtos.md
  - AI Integration:
    - ai/index.md
    - Tool Contracts: ai/tool-contracts.md
    - Remediation Actions: ai/remediation-actions.md
  - Developer Guide:
    - developer/index.md
    - Quickstart: developer/quickstart.md
    - Concepts: developer/concepts.md
    - Architecture: developer/architecture.md
    - Integrating: developer/integrating.md
    - Use Cases: developer/use-cases.md
    - Validation Rules: developer/validation-rules.md
    - Semantic Layer: developer/semantic-layer.md
    - Semantic Validation: developer/semantic-validation-rules.md
    - YAML Assets: developer/yaml-assets.md
    - CLI Patterns: developer/cli-patterns.md
    - Golden Testing: developer/golden-testing.md
    - Data Dictionary: developer/data-dictionary-contrib.md
  - Architecture Decisions:
    - adr/001-identity-owns-meaning-semantic-owns-calculation.md
    - adr/002-three-boundary-contracts.md
    - adr/003-orchestration-in-facade.md
  - Appendices:
    - Design Constraints: appendix/design-constraints.md
    - Capability Matrix: appendix/capability-matrix.md
    - Sample Project: appendix/sample-project.md

docs_dir: docs
site_dir: site

markdown_extensions:
  - tables
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

exclude_docs: |
  _partials/
