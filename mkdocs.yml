site_name: Invariant Analytics Kernel
site_description: Semantic validation layer for statistical data platforms
repo_url: https://github.com/adieyal/invariant
repo_name: adieyal/invariant
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false  # Using custom fonts via CSS
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Quickstart: getting-started/quickstart.md
    - Mental Model: getting-started/mental-model.md
  - Examples:
    - examples/index.md
    - Indicator Aggregation: examples/indicator-aggregation.md
    - Cross-dataset Comparison: examples/cross-dataset-comparison.md
    - Reference System Changes: examples/reference-system-changes.md
    - Suppression: examples/suppression.md
  - Concepts:
    - concepts/index.md
    - Universe: concepts/universe.md
    - Variables: concepts/variables.md
    - Reference Systems: concepts/reference-systems.md
    - Data Products: concepts/data-products.md
    - Validation Gate: concepts/validation-gate.md
  - Architecture:
    - architecture/index.md
    - Two Planes and Gate: architecture/two-planes-and-gate.md
    - Progressive Rigor: architecture/progressive-rigor.md
    - Scope Boundaries: architecture/scope-boundaries.md
  - Integration:
    - integration/index.md
    - Minimal Integration: integration/minimal-integration.md
    - Progressive Features: integration/progressive-features.md
    - Catalog: integration/catalog.md
    - Query Lifecycle: integration/query-lifecycle.md
  - Reference:
    - reference/index.md
    - Glossary: generated/glossary.md
    - Ports: reference/ports.md
    - Use Cases: reference/use-cases.md
    - DTOs: reference/dtos.md
  - AI Integration:
    - ai/index.md
    - Tool Contracts: ai/tool-contracts.md
    - Remediation Actions: ai/remediation-actions.md
  - Appendices:
    - Design Constraints: appendix/design-constraints.md
    - Capability Matrix: appendix/capability-matrix.md
    - Sample Project: appendix/sample-project.md

docs_dir: docs
site_dir: site

markdown_extensions:
  - tables
  - admonition
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adieyal/invariant
      name: Invariant on GitHub

exclude_docs: |
  _partials/
