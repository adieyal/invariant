name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check src tests

      - name: Run ruff format check
        run: ruff format --check src tests

      - name: Run tests
        run: pytest

      - name: Validate semantic assets
        run: |
          # Validate test fixture assets
          python scripts/validate_semantic_assets.py tests/integration/wazimap/fixtures
          python scripts/validate_semantic_assets.py tests/integration/golden/fixtures/simple_agg/catalog
          python scripts/validate_semantic_assets.py tests/integration/golden/fixtures/ratio/catalog
          python scripts/validate_semantic_assets.py tests/integration/golden/fixtures/derived/catalog
          python scripts/validate_semantic_assets.py tests/integration/golden/fixtures/multi_metric/catalog
          python scripts/validate_semantic_assets.py tests/integration/golden/fixtures/filtered/catalog
