[project]
name = "census-explorer"
version = "0.1.0"
description = "Sample project demonstrating Invariant analytics kernel"
requires-python = ">=3.12"
dependencies = [
    "invariant",
    "typer>=0.9",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
census-explorer = "census_explorer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/census_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
