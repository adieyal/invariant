<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Data Dictionary{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">
                <a href="{{ url_for('index') }}">Data Dictionary</a>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('datasets_list') }}">Datasets</a>
                <a href="{{ url_for('indicators_list') }}">Indicators</a>
            </div>
            <div class="nav-search">
                <form action="{{ url_for('indicators_list') }}" method="get">
                    <input type="text" name="q" placeholder="Search indicators..." value="{{ request.args.get('q', '') }}">
                    <button type="submit">Search</button>
                </form>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Data Dictionary - Semantic Catalog Explorer</p>
    </footer>
</body>
</html>
